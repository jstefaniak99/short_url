server.port=8081

# Cassandra configuration
spring.data.cassandra.contact-points=cassandra
spring.data.cassandra.keyspace-name=redirect_keyspace
spring.data.cassandra.local-datacenter=datacenter1

# Kafka configuration - używamy kafka jako hostname w Docker
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=url-shortener-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka producer configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Włącz Kafka
kafka.enabled=true

# Cassandra connection settings (opcjonalne)
spring.data.cassandra.connect-timeout=60s
spring.data.cassandra.read-timeout=60s